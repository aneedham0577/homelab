# pihole/compose.yaml
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - TZ=${TZ:-America/Chicago}
      - PIHOLE_UID=${PUID}
      - PIHOLE_GID=${PGID}
      - FTLCONF_dns_upstreams=unbound#53
      - FTLCONF_dns_domain=${HOMELAB_HOSTNAME}
      - FTLCONF_dns_piholePTR=HOSTNAMEFQDN
      - FTLCONF_webserver_domain=${PIHOLE_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_port=80
      - DNSMASQ_LISTENING=all
      - FTLCONF_webserver_api_password=
      - FTLCONF_misc_dnsmasq_lines=address=/.${HOMELAB_HOSTNAME}/${HOMELAB_IP_ADDRESS}
      - FTLCONF_dns_hosts=${HOMELAB_IP_ADDRESS} ${HOMELAB_HOSTNAME};
    volumes:
      - ${PROJECT_ROOT}/services/pihole/volumes/etc-pihole:/etc/pihole/
      - ${PROJECT_ROOT}/services/pihole/volumes/logs:/run/log/pihole/
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.middlewares.pihole-admin-redirect.redirectregex.regex=^https?://[^/]+/admin$$"
      - "traefik.http.middlewares.pihole-admin-redirect.redirectregex.replacement=/admin/"
      - "traefik.http.middlewares.pihole-admin-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.pihole.middlewares=pihole-admin-redirect,authentik-auth@file"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    depends_on:
      unbound:
        # Started is enough for compose up; setup.py waits for healthy afterward.
        # Requiring unbound healthy here aborts the whole stack if first-boot DNS
        # priming is slow (common on Docker Desktop/WSL).
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/admin"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

networks:
  homelab-net:
    external: true
