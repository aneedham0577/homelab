# gatus/compose.yaml
services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    environment:
      HOMELAB_HOSTNAME: ${HOMELAB_HOSTNAME}
      DASHBOARD_SERVICE_NAME: ${DASHBOARD_SERVICE_NAME:-dashboard}
      PIHOLE_SERVICE_NAME: ${PIHOLE_SERVICE_NAME:-dns}
    volumes:
      - ${PROJECT_ROOT}/services/gatus/config.yaml:/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_RAW
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`${GATUS_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.gatus.entrypoints=websecure"
      - "traefik.http.routers.gatus.tls=true"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"
    # No healthcheck: scratch-based image (no shell/wget/curl) and the gatus
    # binary has no health subcommand. Traefik + the dashboard cover liveness;
    # gatus validates its config at startup and exits on failure.

networks:
  homelab-net:
    external: true
